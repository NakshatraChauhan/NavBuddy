<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision Companion</title>
  <style>
    :root {
      --bg: #030811;
      --panel: #0b1322;
      --panel-2: #0a1020;
      --text: #f4f7ff;
      --muted: #96a3ba;
      --accent: #00d7a7;
      --accent-soft: rgba(0, 215, 167, 0.15);
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top center, #081725 0%, var(--bg) 55%);
      display: grid;
      place-items: start center;
      padding: 16px;
    }
    .app {
      width: min(390px, 100%);
      border: 1px solid rgba(0, 215, 167, 0.15);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(8, 17, 30, 0.95), rgba(2, 7, 14, 0.98));
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .header { text-align: center; padding: 22px 18px 14px; }
    .header h1 { margin: 0; font-size: 2.6rem; letter-spacing: 0.2px; }
    .header p { margin: 6px 0 0; color: var(--muted); font-size: 1.1rem; }

    .status-ring-wrap { padding: 8px 20px 22px; display: grid; place-items: center; }
    .status-ring {
      width: 255px;
      height: 255px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(0, 215, 167, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
      box-shadow: 0 0 35px rgba(0, 215, 167, 0.2), inset 0 0 30px rgba(0, 215, 167, 0.1);
    }
    .status-ring.active {
      border-color: #00f2bf;
      box-shadow: 0 0 45px rgba(0, 242, 191, 0.25), inset 0 0 35px rgba(0, 242, 191, 0.16);
    }
    .mic-icon {
      width: 54px;
      height: 54px;
      color: var(--accent);
      margin: 0 auto 10px;
      opacity: 0.95;
    }
    .mode-text {
      text-transform: uppercase;
      letter-spacing: 2.6px;
      font-weight: 700;
      color: var(--accent);
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding: 10px;
      background: rgba(4, 10, 18, 0.8);
    }
    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      min-height: 78px;
      display: grid;
      align-content: space-between;
    }
    .card-title { font-size: 0.78rem; color: #8d99b3; letter-spacing: 1.2px; text-transform: uppercase; }
    .card-value { font-size: 1.3rem; font-weight: 700; }
    .ok { color: var(--accent); }

    .assist { padding: 0 12px 14px; }
    #guidanceText { margin: 8px 0 0; color: #d9e1f0; font-size: 0.96rem; }
    #detectionsList { margin: 8px 0 0; padding-left: 18px; color: #a5b3ca; font-size: .9rem; }
    #log { max-height: 140px; overflow: auto; font-size: .85rem; color: #91a0b7; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }

    video { display: none; }
    canvas { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Vision Companion</h1>
      <p>Audio-first blind navigation assistant</p>
    </header>

    <section class="status-ring-wrap" aria-live="polite">
      <div class="status-ring" id="statusRing">
        <div>
          <svg class="mic-icon" id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"/>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
            <path d="M12 18v5"/>
            <path d="M8 23h8"/>
            <path d="M2 2l20 20"/>
          </svg>
          <div class="mode-text" id="status">Stopped</div>
        </div>
      </div>
    </section>

    <section class="cards">
      <article class="card">
        <div class="card-title">GPS</div>
        <div class="card-value" id="gpsState">Locked</div>
      </article>
      <article class="card">
        <div class="card-title">Vision</div>
        <div class="card-value" id="visionState">Off</div>
      </article>
      <article class="card">
        <div class="card-title">Microphone</div>
        <div class="card-value" id="micState">Pending</div>
      </article>
      <article class="card">
        <div class="card-title">Audio</div>
        <div class="card-value" id="audioState">Pending</div>
      </article>
    </section>

    <section class="assist">
      <p id="guidanceText">Say “Start navigation” to begin.</p>
      <ul id="detectionsList"></ul>
      <div id="log"></div>
    </section>

    <video id="camera" autoplay playsinline muted></video>
    <canvas id="snapshot" width="640" height="480"></canvas>
  </main>

  <script type="module" src="{{ url_for('static', filename='navigation.js') }}"></script>
</body>
</html>
